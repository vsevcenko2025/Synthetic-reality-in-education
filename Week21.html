<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            pointer-events: none;
            z-index: 100;
            display: none;
        }
        #xr-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: 1px solid white;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
        }
        #log-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 200px;
            max-height: 300px;
            overflow-y: auto;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            z-index: 100;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <img id="crosshair" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIiB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCI+PGNpcmNsZSBjeD0iNTAiIGN5PSI1MCIgcj0iNDAiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIyIiBmaWxsPSJub25lIiBzdHJva2Utb3BhY2l0eT0iMC43Ii8+PGNpcmNsZSBjeD0iNTAiIGN5PSI1MCIgcj0iNSIgZmlsbD0iI2ZmZiIgZmlsbC1vcGFjaXR5PSIwLjciLz48bGluZSB4MT0iNTAiIHkxPSIxMCIgeDI9IjUwIiB5Mj0iMzAiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2Utb3BhY2l0eT0iMC43Ii8+PGxpbmUgeDE9IjUwIiB5MT0iNzAiIHgyPSI1MCIgeTI9IjkwIiBzdHJva2U9IiNmZmYiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLW9wYWNpdHk9IjAuNyIvPjxsaW5lIHgxPSIxMCIgeTE9IjUwIiB4Mj0iMzAiIHkyPSI1MCIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1vcGFjaXR5PSIwLjciLz48bGluZSB4MT0iNzAiIHkxPSI1MCIgeDI9IjkwIiB5Mj0iNTAiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2Utb3BhY2l0eT0iMC43Ii8+PC9zdmc+" alt="crosshair">
    
    <button id="xr-button">Увімкнути AR</button>

    <div id="log-panel"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/webxr/ARButton.js"></script>
    
    <script>
        let scene, camera, renderer, model;
        let currentSession = null;
        let isARMode = false;
        let arButtonElement = null;
        let tapCount = 0;
        
        init();
        animate();
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);
            
            document.getElementById('xr-button').addEventListener('click', toggleXRMode);
            document.addEventListener('touchstart', onTouch);
            window.addEventListener('resize', onWindowResize);
        }

        function logMessage(message) {
            const logPanel = document.getElementById('log-panel');
            const p = document.createElement('div');
            p.textContent = message;
            logPanel.appendChild(p);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function onTouch() {
            tapCount++;
            logMessage('Дотик #' + tapCount);
            
            if (tapCount === 1) {
                if (!model) {
                    const loader = new THREE.GLTFLoader();
                    loader.load('texture/robot ball.glb', function (gltf) {
                        model = gltf.scene;
                        model.scale.set(0.5, 0.5, 0.5);
                        scene.add(model);
                        logMessage('Модель завантажена');
                    }, undefined, function (error) {
                        console.error('Помилка завантаження моделі:', error);
                        logMessage('Помилка завантаження моделі');
                    });
                }
            } else if (tapCount === 2) {
                document.getElementById('crosshair').style.display = 'block';
                logMessage('Приціл показано');
            }
        }

        function toggleXRMode() {
            if (isARMode) {
                
                if (currentSession) {
                    currentSession.end();
                    currentSession = null;
                }
                document.getElementById('xr-button').textContent = 'Увімкнути AR';
                logMessage('AR вимкнено');
                isARMode = false;
            } else {
               
                if (!navigator.xr) {
                    logMessage('WebXR не підтримується у вашому браузері');
                    return;
                }

                navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                    if (supported) {
                        const sessionInit = { 
                            requiredFeatures: ['hit-test'],
                            optionalFeatures: ['dom-overlay'],
                            domOverlay: { root: document.body }
                        };

                        navigator.xr.requestSession('immersive-ar', sessionInit).then((session) => {
                            currentSession = session;
                            renderer.xr.setSession(session);
                            document.getElementById('xr-button').textContent = 'Вийти з AR';
                            logMessage('AR увімкнено');
                            isARMode = true;

                            session.addEventListener('end', () => {
                                currentSession = null;
                                document.getElementById('xr-button').textContent = 'Увімкнути AR';
                                logMessage('AR сесія завершена');
                                isARMode = false;
                            });
                        }).catch((err) => {
                            logMessage('Помилка запуску AR: ' + err.message);
                        });
                    } else {
                        logMessage('AR не підтримується на цьому пристрої');
                    }
                }).catch((err) => {
                    logMessage('Помилка перевірки підтримки AR: ' + err.message);
                });
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(() => {
                renderer.render(scene, camera);
            });
        }
    </script>
</body>
</html>
