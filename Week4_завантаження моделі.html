<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MindARThree } from 'mindar-image-three';

    
    const mindarThree = new MindARThree({
      container: document.body,
      imageTargetSrc: './markers/Week4.mind'
    });

    const { renderer, scene, camera } = mindarThree;

  
    const ambientLight = new THREE.AmbientLight(0xffffff, 1); 
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(0, 1, 1);
    scene.add(directionalLight);

   
    const anchor1 = mindarThree.addAnchor(0);

    
    const loader = new GLTFLoader();
    loader.load('./texture/alien.glb', (gltf) => {
      const model1 = gltf.scene;
      model1.scale.set(1, 1, 1); 
     model1.rotation.y = Math.PI * 2; 
      anchor1.group.add(model1);
    });

    
    const anchor2 = mindarThree.addAnchor(1);

    
    loader.load('./texture/spaceship.glb', (gltf) => {
      const model2 = gltf.scene;
      model2.scale.set(0.001, 0.001, 0.001); 
      model2.rotation.y = Math.PI;
      anchor2.group.add(model2);
    });

    
    await mindarThree.start();
    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
