<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>3D Spaceship Viewer</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }
        #ar-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        #ar-button:hover {
            background: #3367d6;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        #ar-button:active {
            transform: translateY(0);
        }
        #ar-button:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="loading">Loading  model...</div>
    <button id="ar-button">View in AR</button>

    
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/webxr/ARButton.min.js"></script>

    <script>
        let scene, camera, renderer, spaceship;
        let arSession = false;

        init();
        animate();

        function init() {
           
            scene = new THREE.Scene();
            
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 5;
            
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);
            
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            
            const loader = new THREE.GLTFLoader();
            loader.load(
                'texture/spaceship cargo.glb', // Your model path
                function(gltf) {
                    spaceship = gltf.scene;
                    spaceship.scale.set(0.7, 0.7, 0.7);
                    scene.add(spaceship);
                    document.getElementById('loading').style.display = 'none';
                    
                    
                    initARButton();
                },
                undefined,
                function(error) {
                    console.error('Error loading model:', error);
                    document.getElementById('loading').textContent = 'Error loading spaceship model';
                    document.getElementById('ar-button').disabled = true;
                }
            );
            
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function initARButton() {
            const arButton = document.getElementById('ar-button');
            
            
            if (navigator.xr) {
                navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                    if (supported) {
                       
                        arButton.addEventListener('click', () => {
                            if (!renderer.xr.isPresenting) {
                                
                                renderer.xr.setReferenceSpaceType('local');
                                renderer.xr.setAnimationLoop(() => {
                                    renderer.render(scene, camera);
                                });
                                
                                
                                if (spaceship) spaceship.scale.set(0.3, 0.3, 0.3);
                                
                                
                                navigator.xr.requestSession('immersive-ar', {
                                    requiredFeatures: ['hit-test'],
                                    optionalFeatures: ['dom-overlay'],
                                    domOverlay: { root: document.body }
                                }).then((session) => {
                                    session.addEventListener('end', () => {
                                        
                                        if (spaceship) spaceship.scale.set(0.5, 0.5, 0.5);
                                    });
                                    renderer.xr.setSession(session);
                                }).catch((err) => {
                                    console.error('AR session failed:', err);
                                    alert('Failed to start AR session: ' + err.message);
                                });
                            }
                        });
                    } else {
                        arButton.disabled = true;
                        arButton.textContent = 'AR Not Supported';
                    }
                }).catch((err) => {
                    console.error('AR support check failed:', err);
                    arButton.disabled = true;
                    arButton.textContent = 'AR Error';
                });
            } else {
                arButton.disabled = true;
                arButton.textContent = 'AR Not Supported';
            }
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            renderer.setAnimationLoop(() => {
                
                if (spaceship && !renderer.xr.isPresenting) {
                    spaceship.rotation.y += 0.005;
                }
                renderer.render(scene, camera);
            });
        }
    </script>
</body>
</html>
